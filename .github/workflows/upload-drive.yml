name: Upload to Google Drive

on:
  push:
    branches:
      - tuyen
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Zip Workspace
        run: zip -r release.zip . -x "*.git*"

      # Đã nâng cấp lên Python 3.11 để khắc phục cảnh báo FutureWarning
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install google-api-python-client google-auth

      # Cách xuất file JSON an toàn hơn, tránh lỗi multiline
      - name: Create credentials file
        env:
          CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
        run: echo "$CREDENTIALS" > service_account.json

      - name: Upload using Python
        env:
          FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          cat << 'EOF' > upload.py
          import os
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          SCOPES = ['https://www.googleapis.com/auth/drive']
          creds = service_account.Credentials.from_service_account_file('service_account.json', scopes=SCOPES)
          service = build('drive', 'v3', credentials=creds)

          file_metadata = {'name': 'release.zip', 'parents': [os.environ['FOLDER_ID']]}
          media = MediaFileUpload('release.zip', mimetype='application/zip', resumable=True)

          print("Đang tiến hành upload lên Google Drive...")
          file = service.files().create(body=file_metadata, media_body=media, fields='id').execute()
          print(f"Upload thành công! File ID: {file.get('id')}")
          EOF
          python upload.py

      - name: Cleanup
        if: always()
        run: rm -f service_account.json upload.py release.zip
