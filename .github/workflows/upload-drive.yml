name: Upload to Google Drive

on:
  push:
    branches:
      - tuyen
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Zip Workspace
        run: zip -r release.zip . -x "*.git*"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Upload using Python
        env:
          FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: |
          cat << 'EOF' > upload.py
          import os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          # Sử dụng Refresh Token mới thay cho Service Account cũ
          creds = Credentials(
              token=None,
              refresh_token=os.environ['REFRESH_TOKEN'],
              token_uri='https://oauth2.googleapis.com/token',
              client_id=os.environ['CLIENT_ID'],
              client_secret=os.environ['CLIENT_SECRET']
          )
          service = build('drive', 'v3', credentials=creds)

          file_metadata = {'name': 'release.zip', 'parents': [os.environ['FOLDER_ID']]}
          media = MediaFileUpload('release.zip', mimetype='application/zip', resumable=True)

          print("Đang tiến hành upload lên Google Drive...")
          file = service.files().create(body=file_metadata, media_body=media, fields='id').execute()
          print(f"Upload thành công! File ID: {file.get('id')}")
          EOF
          python upload.py

      - name: Cleanup
        if: always()
        run: rm -f upload.py release.zip
